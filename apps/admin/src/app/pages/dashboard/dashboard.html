<div class="dashboard" [attr.data-testid]="selectors.CONTAINER">
  <div class="dashboard__header">
    <h1 class="dashboard__title" [attr.data-testid]="selectors.TITLE">
      {{ messages.TITLE }}
    </h1>
    <p class="dashboard__subtitle" [attr.data-testid]="selectors.SUBTITLE">
      {{ messages.SUBTITLE }}
    </p>
  </div>

  <div class="dashboard__body">
    <p
      class="dashboard__description"
      [attr.data-testid]="selectors.DESCRIPTION"
    >
      {{ messages.DESCRIPTION }}
    </p>
  </div>
</div>
