<div class="auth-layout">
  <div class="auth-layout__body">
    <section class="auth-layout__left" aria-label="Brand banner">
      <div class="auth-layout__left-content">
        <h1 class="auth-layout__title">{{ messages.TITLE }}</h1>
        <h2 class="auth-layout__subtitle">{{ messages.SUBTITLE }}</h2>
        <p class="auth-layout__description">{{ messages.DESCRIPTION }}</p>
      </div>
    </section>

    <main class="auth-layout__right">
      <router-outlet />
    </main>
  </div>
</div>
